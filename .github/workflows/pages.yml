name: deploy-book

# Only run this when the main branch changes
on:
  push:
    branches:
    - main

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js (required by Jupyter Book 2)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        pip install -r requirements-docs.txt

    # Build the book. BASE_URL is needed because the site is served from
    # https://byucamacholab.github.io/Photonics-Bootcamp/ rather than the domain root.
    - name: Build the book
      working-directory: book
      env:
        BASE_URL: /${{ github.event.repository.name }}
      run: |
        jupyter book build --html

    # Configures GitHub Pages. The previously published marimo site under /next/
    # is kept in place (its sources now live in archive/ and are no longer rebuilt).
    - name: Deploy root site 🚀
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: book/_build/html # The folder the action should deploy.
        clean: true
        clean-exclude: |
          .nojekyll
          next
